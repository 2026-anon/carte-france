<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Thème clair uniquement : l'assombrissement automatique de certains navigateurs mobiles déforme les couleurs. -->
    <meta name="color-scheme" content="only light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Carte de France</title>
  </head>
  <body>
    <div id="carte" role="application" aria-label="Carte interactive de la France"></div>
    <header class="titre">
      <h1>Carte de France</h1>
      <p>Départements de France métropolitaine</p>
    </header>
    <div class="panneau">
      <details id="filtres" class="bloc filtres" hidden></details>
      <details id="legende" class="bloc legende" hidden></details>
    </div>
    <noscript>Cette carte nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
